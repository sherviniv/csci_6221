# Constant-time nginx backend for the throughput test (the proxy is the bottleneck).
worker_processes 1;
events { worker_connections 8192; }
http {
  access_log off;
  keepalive_requests 1000000;
  # counters for the benchmark: how many TCP connections did the proxy open to us?
  server { listen 81; location /stub { stub_status; } }
  server {
    listen 80;
    location /health { return 200 "ok"; }
    location / { return 200 "hello from backend\n"; }
  }
}
