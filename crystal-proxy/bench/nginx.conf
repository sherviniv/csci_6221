# One nginx, one worker, several listeners. least_conn everywhere, upstream keepalive.
worker_processes 1;
events { worker_connections 8192; }
http {
  access_log off;

  # keepalive N = idle upstream connections kept per worker. With more concurrent clients than N,
  # nginx has to close and reopen the surplus upstream connections, so test both 64 and 1024.
  upstream throughput     { least_conn; server backend1:80; server backend2:80; keepalive 64; }
  upstream throughput1024 { least_conn; server backend1:80; server backend2:80; keepalive 1024; }
  upstream slowpool       { least_conn; server fast:80;     server slow:80;     keepalive 64; }
  # max_fails=0 turns off nginx's passive "stop using a server after it failed" behaviour.
  upstream slownofail     { least_conn; server fast:80 max_fails=0; server slow:80 max_fails=0; keepalive 64; }

  # 8081 / 8088: throughput test
  server {
    listen 8081;
    location / { proxy_pass http://throughput; proxy_http_version 1.1; proxy_set_header Connection ""; }
  }
  server {
    listen 8088;
    location / { proxy_pass http://throughput1024; proxy_http_version 1.1; proxy_set_header Connection ""; }
  }

  # 8085: slow-backend test, nginx defaults (waits for the slow server, up to 60 s)
  server {
    listen 8085;
    location / { proxy_pass http://slowpool; proxy_http_version 1.1; proxy_set_header Connection ""; }
  }

  # 8086: slow-backend test, short read timeout + retry on the next server (max_fails default = 1)
  server {
    listen 8086;
    location / {
      proxy_pass http://slowpool;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_read_timeout 200ms;
      proxy_next_upstream error timeout;
    }
  }

  # 8089: same as 8086 but with passive ejection disabled (max_fails=0)
  server {
    listen 8089;
    location / {
      proxy_pass http://slownofail;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_read_timeout 200ms;
      proxy_next_upstream error timeout;
    }
  }
}
