# Same as throughput.yml but the idle pool can hold 1024 connections per backend.
listen: "0.0.0.0:8090"
metrics_listen: "0.0.0.0:9095"
access_log: false
pools:
  app:
    backends: ["http://backend1:80", "http://backend2:80"]
    health_path: "/health"
    max_idle_connections: 1024
routes:
  - {host: "*", path_prefix: "/", pool: app}
